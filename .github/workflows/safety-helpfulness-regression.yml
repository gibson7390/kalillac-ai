# Offline safety and helpfulness regression suite.
#
# This job runs the permanent deterministic suite under
# candidate/tests/safety_suite plus the existing crisis-routing module. It
# makes NO provider call and uses NO credential: candidate/tests/conftest.py
# refuses every non-loopback connection for the whole run, and placeholder
# provider keys are set only so configuration-dependent code paths import. The
# gated live-evaluation runner is never invoked here; its own tests prove it
# refuses to go live without an explicit owner gate and bounds.
#
# No PostgreSQL, database migration, provider, application server or deployment
# is involved. Installing the pinned dependencies may contact the Python
# package index (pip); the test run itself reaches only loopback.
name: safety-helpfulness-regression

on:
  pull_request:
    paths:
      - "candidate/**"
      - "requirements-*.txt"
      - ".github/workflows/safety-helpfulness-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safety-helpfulness-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # Placeholder keys only. The network guard blocks every non-loopback
      # connection, so these can never reach a provider.
      OPENAI_API_KEY: "offline-ci-key"
      BRAVE_API_KEY: "offline-ci-key"
      TAVILY_API_KEY: "offline-ci-key"
      GROQ_API_KEY: "offline-ci-key"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # May contact the Python package index.
      - name: Install the repository's pinned dependencies
        run: >-
          python -m pip install
          -r requirements-production-lock.txt
          -r requirements-database.txt
          -r requirements-dev.txt

      # The corpus is generated deterministically; the committed file must
      # match a fresh build so a stale corpus cannot pass review.
      - name: Check the committed corpus is up to date
        working-directory: candidate
        run: |
          python -m tests.safety_suite.build_corpus
          if ! git diff --quiet -- tests/safety_suite/corpus_v1.json; then
            echo "corpus_v1.json is stale; run 'python -m tests.safety_suite.build_corpus'" >&2
            git --no-pager diff -- tests/safety_suite/corpus_v1.json
            exit 1
          fi

      # The live runner's dry run must make no provider call and must refuse to
      # go live without the owner gate. The network guard is also active here.
      - name: Dry-run the gated live runner (no provider calls)
        working-directory: candidate
        run: python -m tests.safety_suite.live_runner

      # conftest.py blocks every non-loopback connection for the whole run.
      - name: Run the offline safety and helpfulness suite
        working-directory: candidate
        run: >-
          python -m pytest
          tests/safety_suite
          tests/test_crisis_routing.py
          -v -rA -p no:cacheprovider
          --junitxml="$RUNNER_TEMP/safety-helpfulness-regression.xml"

      # A green run must mean every test executed: none skipped, failed or
      # errored, and at least the expected floor of cases collected.
      - name: Require every safety test to have run
        run: |
          python - "$RUNNER_TEMP/safety-helpfulness-regression.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          totals["passed"] = totals["tests"] - totals["skipped"] - totals["failures"] - totals["errors"]
          print(totals)
          if totals["failures"] or totals["errors"] or totals["skipped"]:
              sys.exit("safety suite had failures, errors or unexpected skips")
          if totals["tests"] < 600:
              sys.exit(f"expected at least 600 safety tests, collected {totals['tests']}")
          PY
