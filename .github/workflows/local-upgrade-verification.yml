name: local-upgrade-verification
on:
  pull_request:
    paths:
      - "deploy/local/**"
      - "candidate/tests/test_local_upgrade.py"
      - ".github/workflows/local-upgrade-verification.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned application and test dependencies
        run: python -m pip install -r requirements-production-lock.txt -r requirements-database.txt -r requirements-billing.txt -r requirements-dev.txt
      - name: Require PostgreSQL 16
        run: test -x /usr/lib/postgresql/16/bin/initdb
      # The restore test runs the restored release's own V1 startup gate: the code the owner's install runs
      # today (afa247a, on feat/local-staging), extracted read-only beside the checkout.
      - name: Extract the restored release's code
        run: |
          git fetch --no-tags --depth=1 origin afa247ad58c33c9e11e601d4ee261b0f23942d8a
          mkdir -p "$RUNNER_TEMP/restored"
          git archive afa247ad58c33c9e11e601d4ee261b0f23942d8a candidate | tar -x -C "$RUNNER_TEMP/restored"
          chmod -R go+rX "$RUNNER_TEMP/restored"
      - name: Verify isolated cold backup, migration, integrity and recovery
        run: |
          sudo env KALILLAC_LOCAL_PG_BIN=/usr/lib/postgresql/16/bin \
            KALILLAC_RESTORED_CODE="$RUNNER_TEMP/restored/candidate" \
            "$(command -v python)" -B -m pytest candidate/tests/test_local_upgrade.py \
            -q -ra -p no:cacheprovider --junitxml="$RUNNER_TEMP/local-upgrade.xml"
          python - "$RUNNER_TEMP/local-upgrade.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          print(totals)
          if totals != {"tests": 189, "skipped": 0, "failures": 0, "errors": 0}:
              raise SystemExit("The complete upgrade suite must run without skips.")
          PY
