# Verification for the subscription foundation: accounts, entitlements, usage
# quotas, account recovery, email verification, Stripe billing and operator
# subscription reconciliation.
#
# suites: the existing account, entitlement, usage and billing test files on
# SQLite with an injected fake Stripe gateway. The real Stripe adapter is
# exercised through the stripe library itself, without any request.
#
# billing-postgres: the billing service's locking, idempotency and rollback
# checks, including operator reconciliation
# (candidate/tools/verify_billing_postgres.py), against a disposable
# PostgreSQL service container, migrated with the repository's Alembic chain.
# The tool only accepts the database kalillac_staging and role
# kalillac_staging_app, so the container is provisioned with those names.
#
# Network: installing pinned dependencies may contact the Python package
# index. The test run is protected by candidate/tests/conftest.py, which
# refuses every non-loopback connection; the PostgreSQL job connects only to
# its local service container. Every credential below is a fixed throwaway
# value for that container. No repository secret, Stripe key, production or
# staging setting is used, and nothing contacts Stripe.
name: subscription-foundation-verification

on:
  pull_request:
    paths:
      - "candidate/**"
      - "requirements-*.txt"
      - "deploy/staging/**"
      - "frontend/**"
      - ".github/workflows/subscription-foundation-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subscription-foundation-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # May contact the Python package index.
      - name: Install the repository's pinned dependencies
        run: >-
          python -m pip install
          -r requirements-production-lock.txt
          -r requirements-database.txt
          -r requirements-billing.txt
          -r requirements-dev.txt

      # conftest.py blocks every non-loopback connection for the whole run.
      - name: Run the account, entitlement, usage and billing suites
        working-directory: candidate
        run: >-
          python -m pytest
          tests/test_billing.py
          tests/test_billing_cases.py
          tests/test_billing_concurrency.py
          tests/test_billing_reconciliation.py
          tests/test_billing_reconcile_tool.py
          tests/test_stripe_gateway.py
          tests/test_accounts.py
          tests/test_login_rate_limit.py
          tests/test_account_recovery.py
          tests/test_recovery_rate_limit.py
          tests/test_account_recovery_concurrency.py
          tests/test_account_recovery_migration.py
          tests/test_recovery_postgres_verifier.py
          tests/test_email_verification.py
          tests/test_email_verification_rate_limit.py
          tests/test_email_verification_concurrency.py
          tests/test_email_verification_migration.py
          tests/test_email_verification_postgres_verifier.py
          tests/test_resend_gateway.py
          tests/test_email_provider.py
          tests/test_session_end.py
          tests/test_chat_error_integrity.py
          tests/test_entitlements.py
          tests/test_usage_limits.py
          tests/test_usage_metering.py
          tests/test_usage_enforcement.py
          tests/test_anonymous_quota.py
          tests/test_anonymous_chat.py
          tests/test_account_migration.py
          tests/test_db_foundation.py
          tests/test_db_engine_concurrency.py
          tests/test_owner_report.py
          tests/test_account_attempts.py
          -v -rA -p no:cacheprovider
          --junitxml="$RUNNER_TEMP/subscription-foundation.xml"

      # A green run must mean every test executed: exactly the expected
      # number collected (1583, from `pytest --collect-only` over the files; 1572 before the 11
      # per-account provider-attempt tests (Codex F3); 1566 before the owner
      # report's 6 (O1); 1551 before the 15
      # refund-and-dispute tests of test_billing_cases.py were added
      # above), and none skipped, failed or errored. A missing stripe package
      # would skip the Stripe adapter tests, so it fails the run instead.
      - name: Require every test to have run
        run: |
          python - "$RUNNER_TEMP/subscription-foundation.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          print(totals)
          if totals != {"tests": 1583, "skipped": 0, "failures": 0, "errors": 0}:
              sys.exit("the subscription foundation verification did not run completely")
          PY

      # These explicit modules also cover real launcher subprocesses using
      # host-file ownership, loopback sockets and SQLite; no PostgreSQL needed.
      - name: Run the Slice 2 password-work and launcher regressions
        working-directory: candidate
        run: >-
          python -m pytest
          tests/test_password_work.py
          tests/test_password_work_routes.py
          tests/test_registration_rate_limit.py
          tests/test_kalillac_server.py
          -v -rA -p no:cacheprovider
          --junitxml="$RUNNER_TEMP/slice-2-security.xml"

      # Actual collect-only result for the four explicit modules: 106 tests.
      # No skip is expected, including for launcher subprocess coverage.
      - name: Require every Slice 2 security test to have run
        run: |
          python - "$RUNNER_TEMP/slice-2-security.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          print(totals)
          if totals != {"tests": 106, "skipped": 0, "failures": 0, "errors": 0}:
              sys.exit("the Slice 2 security verification did not run completely")
          PY

      - name: Run the Slice 3 registration security contracts
        working-directory: candidate
        run: >-
          python -m pytest
          tests/test_registration_v2.py
          tests/test_registration_security.py
          tests/test_unsafe_request_guard.py
          -q -p no:cacheprovider
          --junitxml="$RUNNER_TEMP/slice-3-security.xml"

      # 917 = the earlier 818 plus 99 measured on feat/file-assistant-v1: the unsafe-request guard's
      # parametrized cases now also cover the three /api/files mutations in its inventory. No earlier
      # case was removed or weakened.
      - name: Require every Slice 3 security test
        run: |
          python - "$RUNNER_TEMP/slice-3-security.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          print(totals)
          assert totals == {"tests": 917, "skipped": 0, "failures": 0, "errors": 0}
          PY

      - name: Verify Linux protected registration files
        run: |
          set -o pipefail
          sudo "$(command -v python)" -B candidate/tools/verify_registration_protected_files.py | tee "$RUNNER_TEMP/registration-protected-files.log"
          grep -qx "RESULT: 26/26 protected-file checks passed" "$RUNNER_TEMP/registration-protected-files.log"

  billing-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-admin-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PG_ADMIN_PASSWORD: disposable-admin-only
      PG_MIGRATE_PASSWORD: disposable-migrate-only
      PG_APP_PASSWORD: disposable-app-only
      KALILLAC_MIGRATION_REGISTRATION_ROLE: kalillac_staging_registration
      # Mandatory, no default: the NOLOGIN V1 security service/executor/operator roles.
      KALILLAC_V1_SECURITY_SERVICE_ROLE: kalillac_v1_security_service
      KALILLAC_V1_SECURITY_EXECUTOR_ROLE: kalillac_v1_security_executor
      KALILLAC_V1_SECURITY_OPERATOR_ROLE: kalillac_v1_security_operator
      KALILLAC_REGISTRATION_TEST_POSTGRES_URL: postgresql+psycopg://postgres:disposable-admin-only@127.0.0.1:5432/postgres
      KALILLAC_REGISTRATION_REQUIRE_POSTGRES: "true"
      KALILLAC_DB_HOST: 127.0.0.1
      KALILLAC_DB_PORT: "5432"
      KALILLAC_DB_NAME: kalillac_staging
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # May contact the Python package index.
      - name: Install the repository's pinned dependencies
        run: >-
          python -m pip install
          -r requirements-production-lock.txt
          -r requirements-database.txt
          -r requirements-billing.txt
          -r requirements-files.txt
          -r requirements-dev.txt

      # The same role layout as the PostgreSQL provider-ceiling tests: a
      # NOLOGIN owner, a NOINHERIT migration login that is a member of it, and
      # a runtime login with schema USAGE only (migrations grant table DML).
      - name: Provision the disposable database and roles
        run: |
          python - <<'PY'
          import os, base64
          import psycopg
          from psycopg import sql
          ident, literal = sql.Identifier, sql.Literal
          owner, migrate, app = "kalillac_staging_owner", "kalillac_staging_migrate", "kalillac_staging_app"
          database = "kalillac_staging"
          def connect(dbname):
              return psycopg.connect(host="127.0.0.1", port=5432, user="postgres", dbname=dbname,
                                     password=os.environ["PG_ADMIN_PASSWORD"], autocommit=True)
          with connect("postgres") as conn:
              assert conn.execute("SELECT count(*) FROM pg_database WHERE datname = %s", [database]).fetchone() == (0,)
              conn.execute(sql.SQL("CREATE ROLE {} NOLOGIN NOINHERIT").format(ident(owner)))
              conn.execute(sql.SQL("CREATE ROLE {} LOGIN NOINHERIT PASSWORD {}").format(
                  ident(migrate), literal(os.environ["PG_MIGRATE_PASSWORD"])))
              conn.execute(sql.SQL("CREATE ROLE {} LOGIN NOINHERIT PASSWORD {}").format(
                  ident(app), literal(os.environ["PG_APP_PASSWORD"])))
              registration = "kalillac_staging_registration"
              registration_password = base64.urlsafe_b64encode(os.urandom(32)).decode().rstrip("=")
              conn.execute(sql.SQL("CREATE ROLE {} LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD {}").format(
                  ident(registration), literal(registration_password)))
              conn.execute(sql.SQL("GRANT {} TO {}").format(ident(owner), ident(migrate)))
              # Migration 0013's operator prerequisites: NOLOGIN service and
              # executor roles, and the single owner->executor edge, SET only.
              service = os.environ["KALILLAC_V1_SECURITY_SERVICE_ROLE"]
              executor = os.environ["KALILLAC_V1_SECURITY_EXECUTOR_ROLE"]
              operator = os.environ["KALILLAC_V1_SECURITY_OPERATOR_ROLE"]   # Migration 0022's operator role P.
              for role in (service, executor, operator):
                  conn.execute(sql.SQL("CREATE ROLE {} NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS").format(
                      ident(role)))
              conn.execute(sql.SQL("GRANT {} TO {} WITH INHERIT FALSE, SET TRUE").format(ident(executor), ident(owner)))
              conn.execute(sql.SQL("CREATE DATABASE {} OWNER {}").format(ident(database), ident(owner)))
              conn.execute(sql.SQL("REVOKE ALL ON DATABASE {} FROM PUBLIC").format(ident(database)))
              conn.execute(sql.SQL("GRANT CONNECT ON DATABASE {} TO {}, {}").format(
                  ident(database), ident(migrate), ident(app)))
          with connect(database) as conn:
              conn.execute("REVOKE ALL ON SCHEMA public FROM PUBLIC")
              conn.execute(sql.SQL("CREATE SCHEMA kalillac AUTHORIZATION {}").format(ident(owner)))
              conn.execute(sql.SQL("GRANT USAGE ON SCHEMA kalillac TO {}").format(ident(app)))
          PY

      # env.py assumes the owner role, so migrated objects are owner-owned
      # and the runtime role receives table DML only.
      - name: Apply the Alembic migrations
        working-directory: candidate
        env:
          KALILLAC_DB_ENABLED: "true"
          KALILLAC_DB_USER: kalillac_staging_migrate
          KALILLAC_MIGRATION_OWNER_ROLE: kalillac_staging_owner
          KALILLAC_MIGRATION_APP_ROLE: kalillac_staging_app
        run: KALILLAC_DB_PASSWORD="$PG_MIGRATE_PASSWORD" python -m alembic upgrade head

      # Round-trip only recovery in this job's disposable service container.
      - name: Verify PostgreSQL recovery downgrade and upgrade
        working-directory: candidate
        env:
          KALILLAC_DB_ENABLED: "true"
          KALILLAC_DB_USER: kalillac_staging_migrate
          KALILLAC_MIGRATION_OWNER_ROLE: kalillac_staging_owner
          KALILLAC_MIGRATION_APP_ROLE: kalillac_staging_app
        run: |
          KALILLAC_DB_PASSWORD="$PG_MIGRATE_PASSWORD" python -m alembic downgrade 0007_anonymous_usage
          KALILLAC_DB_PASSWORD="$PG_MIGRATE_PASSWORD" python -m alembic upgrade head

      # Round-trip only email verification (0009) the same way.
      - name: Verify PostgreSQL email-verification downgrade and upgrade
        working-directory: candidate
        env:
          KALILLAC_DB_ENABLED: "true"
          KALILLAC_DB_USER: kalillac_staging_migrate
          KALILLAC_MIGRATION_OWNER_ROLE: kalillac_staging_owner
          KALILLAC_MIGRATION_APP_ROLE: kalillac_staging_app
        run: |
          KALILLAC_DB_PASSWORD="$PG_MIGRATE_PASSWORD" python -m alembic downgrade 0008_account_recovery_tokens
          KALILLAC_DB_PASSWORD="$PG_MIGRATE_PASSWORD" python -m alembic upgrade head

      # The tool uses an in-process fake Stripe; it never contacts Stripe.
      # A green run requires its exit status 0 and every check passing.
      - name: Run the PostgreSQL billing verification
        working-directory: candidate
        env:
          KALILLAC_DB_USER: kalillac_staging_app
        run: |
          set -o pipefail
          KALILLAC_DB_PASSWORD="$PG_APP_PASSWORD" python tools/verify_billing_postgres.py \
            --expect-db kalillac_staging --expect-user kalillac_staging_app \
            | tee "$RUNNER_TEMP/billing-postgres.log"
          grep -qx "RESULT: 17/17 checks passed" "$RUNNER_TEMP/billing-postgres.log"

      # Provider-neutral in-memory email only. No real delivery or Stripe call.
      - name: Run the PostgreSQL account-recovery verification
        working-directory: candidate
        env:
          KALILLAC_DB_USER: kalillac_staging_app
        run: |
          set -o pipefail
          KALILLAC_DB_PASSWORD="$PG_APP_PASSWORD" python tools/verify_recovery_postgres.py \
            --expect-db kalillac_staging --expect-user kalillac_staging_app \
            | tee "$RUNNER_TEMP/recovery-postgres.log"
          test "$(tail -n 1 "$RUNNER_TEMP/recovery-postgres.log")" = "RESULT: 14/14 checks passed"

      # Provider-neutral in-memory email only. No real delivery or Stripe call.
      - name: Run the PostgreSQL email-verification verification
        working-directory: candidate
        env:
          KALILLAC_DB_USER: kalillac_staging_app
        run: |
          set -o pipefail
          KALILLAC_DB_PASSWORD="$PG_APP_PASSWORD" python tools/verify_email_verification_postgres.py \
            --expect-db kalillac_staging --expect-user kalillac_staging_app \
            | tee "$RUNNER_TEMP/email-verification-postgres.log"
          test "$(tail -n 1 "$RUNNER_TEMP/email-verification-postgres.log")" = "RESULT: 15/15 checks passed"


      # Actual R/A connections and synthetic keys/email; no provider calls.
      - name: Run the real PostgreSQL registration contracts
        working-directory: candidate
        run: >-
          python -m pytest
          tests/test_registration_postgres.py
          tests/test_registration_postgres_boundaries.py
          -q -p no:cacheprovider
          --junitxml="$RUNNER_TEMP/registration-postgres.xml"

      - name: Require every PostgreSQL registration test
        run: |
          python - "$RUNNER_TEMP/registration-postgres.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          print(totals)
          assert totals == {"tests": 53, "skipped": 0, "failures": 0, "errors": 0}
          PY

      - name: Verify protected production-style bootstrap and rotation
        run: |
          set -o pipefail
          sudo env KALILLAC_REGISTRATION_TEST_POSTGRES_URL="$KALILLAC_REGISTRATION_TEST_POSTGRES_URL" KALILLAC_REGISTRATION_REQUIRE_POSTGRES=true "$(command -v python)" -B candidate/tools/verify_registration_bootstrap.py | tee "$RUNNER_TEMP/registration-bootstrap.log"
          python - "$RUNNER_TEMP/registration-bootstrap.log" <<'PY'
          import sys, json
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text().splitlines()[-1])
          assert result["tests"] == 27 and result["failures"] == 0 and result["synthetic_only"]
          PY

      # Actual collect-only result for the two explicit modules: 96 tests.
      # The existing disposable PostgreSQL requirement makes missing PG fail.
      - name: Run V1-01 original-session authorization contracts
        working-directory: candidate
        run: >-
          python -m pytest
          tests/test_account_session_security.py
          tests/test_account_session_security_postgres.py
          -q -ra -p no:cacheprovider
          --junitxml="$RUNNER_TEMP/v1-01-security.xml"

      - name: Require every V1-01 authorization test
        run: |
          python - "$RUNNER_TEMP/v1-01-security.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          print(totals)
          assert totals == {"tests": 96, "skipped": 0, "failures": 0, "errors": 0}
          PY

      # Actual collect-only result for the two explicit modules: 192 tests
      # (65 unit/graph/DDL + 127 real PostgreSQL). Missing PG fails as above.
      - name: Run V1-02A account-security schema preparation contracts
        working-directory: candidate
        run: >-
          python -m pytest
          tests/test_v1_schema.py
          tests/test_v1_schema_postgres.py
          -q -ra -p no:cacheprovider
          --junitxml="$RUNNER_TEMP/v1-02a-schema.xml"

      - name: Require every V1-02A schema preparation test
        run: |
          python - "$RUNNER_TEMP/v1-02a-schema.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          print(totals)
          assert totals == {"tests": 192, "skipped": 0, "failures": 0, "errors": 0}
          PY

      # Actual collect-only result for the two explicit modules: 117 tests
      # (13 unit/graph/DDL + 104 real PostgreSQL). Missing PG fails as above.
      - name: Run V1-02B private session-revocation authority contracts
        working-directory: candidate
        run: >-
          python -m pytest
          tests/test_v1_revocation.py
          tests/test_v1_revocation_postgres.py
          -q -ra -p no:cacheprovider
          --junitxml="$RUNNER_TEMP/v1-02b-revocation.xml"

      - name: Require every V1-02B revocation authority test
        run: |
          python - "$RUNNER_TEMP/v1-02b-revocation.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          print(totals)
          assert totals == {"tests": 117, "skipped": 0, "failures": 0, "errors": 0}
          PY

      # Actual collect-only result for the two explicit modules: 154 tests
      # (18 unit/graph/DDL + 136 real PostgreSQL). Missing PG fails as above.
      - name: Run V1-02C private session issuance and epoch contracts
        working-directory: candidate
        run: >-
          python -m pytest
          tests/test_v1_issuance.py
          tests/test_v1_issuance_postgres.py
          -q -ra -p no:cacheprovider
          --junitxml="$RUNNER_TEMP/v1-02c-issuance.xml"

      - name: Require every V1-02C issuance and epoch test
        run: |
          python - "$RUNNER_TEMP/v1-02c-issuance.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          print(totals)
          assert totals == {"tests": 154, "skipped": 0, "failures": 0, "errors": 0}
          PY

      # Actual collect-only result for the explicit modules: 610 tests (219
      # through 0022; 0023's deletion requests: 18 unit + 42 real PostgreSQL,
      # and 3 more for S's own login; D3's V1 login route: 23 unit, 13 of them
      # for malformed authority answers, outcome types and the login limiter, + 11 real
      # PostgreSQL through HTTP; D3's remaining routes: 90 unit + 14 real
      # PostgreSQL through HTTP; 0024's reset-token issuance and credential read
      # path: 33 unit + 41 real PostgreSQL, HTTP under the final hash grant; D4's
      # operator tool through P: 16 unit + 12 real PostgreSQL; E1/E2 the row-lock
      # anchor, final grants and the operator transition: 14 unit + 19 real
      # PostgreSQL; E3 the whole lifecycle through the routes: 1 real PostgreSQL;
      # the Premium journey through the real application: 1 real PostgreSQL;
      # provisioning a new deployment: 18 real PostgreSQL; the staging files: 9
      # unit; the staging preflight: 34 unit; usage-record cleanup: 9 real PostgreSQL; local staging's provider simulation: 24 unit; Spaces under V1 authorization: 4 real PostgreSQL; billing, usage and the daily quota under
      # V1 authorization: 10 real PostgreSQL; the owner report as the runtime login: 1 real
      # PostgreSQL; Space sends of a Premium and a Free customer: 1 real PostgreSQL;
      # Premium files and images from purchase to cancellation: 1 real PostgreSQL; file and image
      # responses under the daily allowance (Codex finding on 8d5a2d4): 7 real PostgreSQL). S logs in
      # with its own credential in the
      # disposable database only. Missing PG fails as above.
      - name: Run V1-02D service connection, sign-out, password, quarantine and deletion-request authority contracts and the V1 account routes
        working-directory: candidate
        run: >-
          python -m pytest
          tests/test_v1_authority.py
          tests/test_v1_authority_postgres.py
          tests/test_v1_session_end.py
          tests/test_v1_session_end_postgres.py
          tests/test_v1_password_reset.py
          tests/test_v1_password_reset_postgres.py
          tests/test_v1_password_change.py
          tests/test_v1_password_change_postgres.py
          tests/test_registration_activation_guard.py
          tests/test_registration_email_guarantees_postgres.py
          tests/test_v1_quarantine.py
          tests/test_v1_quarantine_postgres.py
          tests/test_v1_deletion_request.py
          tests/test_v1_deletion_request_postgres.py
          tests/test_v1_login.py
          tests/test_v1_login_postgres.py
          tests/test_v1_account_routes.py
          tests/test_v1_account_routes_postgres.py
          tests/test_v1_recovery_credential.py
          tests/test_v1_recovery_credential_postgres.py
          tests/test_v1_account_support.py
          tests/test_v1_account_support_postgres.py
          tests/test_v1_transition.py
          tests/test_v1_transition_postgres.py
