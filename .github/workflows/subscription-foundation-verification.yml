      - name: Require every V1-02D service connection, sign-out, password, quarantine and deletion-request test
        run: |
          python - "$RUNNER_TEMP/v1-02d-authority.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          print(totals)
          assert totals == {"tests": 747, "skipped": 0, "failures": 0, "errors": 0}
          PY

      # Local staging's reset and stop as root, as the owner runs them: among them Codex's F1 scenario, an
      # ancestor owned by another user exchanged immediately before the delete. Disposable fixtures only.
      - name: Run the local staging reset and stop tests as root
        run: |
          echo "kernel $(uname -r)"
          sudo "$(command -v python)" -B -m pytest candidate/tests/test_local_reset.py candidate/tests/test_independent_final_f1.py --deselect candidate/tests/test_local_reset.py::test_pg_running_reads_a_real_pg_ctl_status -q -ra -p no:cacheprovider --junitxml="$RUNNER_TEMP/local-reset-root.xml"
          python - "$RUNNER_TEMP/local-reset-root.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          print(totals)
          assert totals == {"tests": 66, "skipped": 0, "failures": 0, "errors": 0}
          PY

      # The staging runbook's own commands (deploy/staging/README.md, steps 4, 7 and 8), as root on the
      # disposable cluster: provision a new deployment with real root-owned files, run the operator
      # transition as an unprivileged service identity, start the application with the controlled
      # launcher from deploy/staging/settings.env.template, and check it over HTTP. Synthetic values
      # only; no provider is contacted.
      - name: Verify a provisioned deployment starts the application from the staging template
        run: |
          set -o pipefail
          sudo env KALILLAC_REGISTRATION_TEST_POSTGRES_URL="$KALILLAC_REGISTRATION_TEST_POSTGRES_URL" "$(command -v python)" -B candidate/tools/verify_provisioned_boot.py | tee "$RUNNER_TEMP/provisioned-boot.log"
          python - "$RUNNER_TEMP/provisioned-boot.log" <<'PY'
          import sys, json
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text().splitlines()[-1])
          print([case for case in result["results"] if not case["passed"]])
          assert result["tests"] == 16 and result["failures"] == 0 and result["synthetic_only"]
          PY
