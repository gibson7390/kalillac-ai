# Verification of the file generation core (candidate/kalillac_files).
#
# Every generated PDF, DOCX and XLSX is opened again with an independent
# reader and checked. The run needs no PostgreSQL, provider, credential,
# application server or deployment: candidate/tests/conftest.py refuses every
# non-loopback connection for the whole run. Installing the pinned
# dependencies may contact the Python package index (pip).
name: file-generation-verification

on:
  pull_request:
    paths:
      - "candidate/kalillac_files/**"
      - "candidate/tests/test_file_generation.py"
      - "requirements-*.txt"
      - ".github/workflows/file-generation-verification.yml"
  push:
    branches: ["feat/file-generation-**"]
    paths:
      - "candidate/kalillac_files/**"
      - "candidate/tests/test_file_generation.py"
      - "requirements-*.txt"
      - ".github/workflows/file-generation-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-generation-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the repository's pinned dependencies and the document libraries
        run: >-
          python -m pip install
          -r requirements-production-lock.txt
          -r requirements-dev.txt
          -r requirements-files.txt
          -r requirements-files-test.txt

      - name: Run the file generation tests
        working-directory: candidate
        run: >-
          python -m pytest tests/test_file_generation.py -v -rA -p no:cacheprovider
          --junitxml="$RUNNER_TEMP/file-generation.xml"

      # The test module skips itself when a document library is missing, so a
      # green run must prove nothing was skipped and the expected number ran.
      - name: Require every file generation test to have run
        run: |
          python - "$RUNNER_TEMP/file-generation.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          print(totals)
          if totals != {"tests": 155, "skipped": 0, "failures": 0, "errors": 0}:
              sys.exit("the file generation verification did not run completely")
          PY
