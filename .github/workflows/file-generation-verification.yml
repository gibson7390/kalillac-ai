# Verification of the file generation and upload intake cores and their
# isolated worker (candidate/kalillac_files), including editing uploaded files.
#
# Every generated PDF, DOCX, XLSX and PPTX is opened again with an independent
# reader and checked, the intake core is driven with hostile files built in
# the tests, and the worker's time, memory and output limits are exercised
# with real child processes. The run needs no PostgreSQL, provider, credential,
# application server or deployment: candidate/tests/conftest.py refuses every
# non-loopback connection for the whole run. Installing the pinned
# dependencies may contact the Python package index (pip).
name: file-generation-verification

on:
  pull_request:
    paths:
      - "candidate/kalillac_files/**"
      - "candidate/tests/test_file_generation.py"
      - "candidate/tests/test_file_intake.py"
      - "candidate/tests/test_file_worker.py"
      - "candidate/tests/test_document_design.py"
      - "candidate/tests/test_workbook_design.py"
      - "candidate/tests/test_deck_design.py"
      - "candidate/tests/test_file_editing.py"
      - "candidate/tests/test_file_store.py"
      - "candidate/tests/test_file_assistant.py"
      - "candidate/tests/test_files_router.py"
      - "candidate/tests/test_file_intent.py"
      - "candidate/tests/test_files_chat_handoff.py"
      - "candidate/app_fastapi_candidate.py"
      - "candidate/kalillac_accounts/request_guard.py"
      - "frontend/**"
      - "candidate/tests/formula_zoo.py"
      - "candidate/tests/quality_benchmark.py"
      - "candidate/tools/fetch_document_fonts.py"
      - "candidate/tools/render_benchmark.py"
      - "requirements-*.txt"
      - ".github/workflows/file-generation-verification.yml"
  push:
    branches: ["feat/file-generation-**", "feat/document-quality-**", "feat/file-assistant-**"]
    paths:
      - "candidate/kalillac_files/**"
      - "candidate/tests/test_file_generation.py"
      - "candidate/tests/test_file_intake.py"
      - "candidate/tests/test_file_worker.py"
      - "candidate/tests/test_document_design.py"
      - "candidate/tests/test_workbook_design.py"
      - "candidate/tests/test_deck_design.py"
      - "candidate/tests/test_file_editing.py"
      - "candidate/tests/test_file_store.py"
      - "candidate/tests/test_file_assistant.py"
      - "candidate/tests/test_files_router.py"
      - "candidate/tests/test_file_intent.py"
      - "candidate/tests/test_files_chat_handoff.py"
      - "candidate/app_fastapi_candidate.py"
      - "candidate/kalillac_accounts/request_guard.py"
      - "frontend/**"
      - "candidate/tests/formula_zoo.py"
      - "candidate/tests/quality_benchmark.py"
      - "candidate/tools/fetch_document_fonts.py"
      - "candidate/tools/render_benchmark.py"
      - "requirements-*.txt"
      - ".github/workflows/file-generation-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-generation-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the repository's pinned dependencies and the document libraries
        run: >-
          python -m pip install
          -r requirements-production-lock.txt
          -r requirements-dev.txt
          -r requirements-database.txt
          -r requirements-files.txt

      # Chinese, Japanese and Korean fonts are too large to commit: fetched from their pinned
      # sources and verified against the SHA-256 recorded in the font manifest, or the job fails.
      - name: Fetch and verify the document fonts
        working-directory: candidate
        run: python tools/fetch_document_fonts.py

      - name: Run the file generation, upload intake, worker and design-system tests
        working-directory: candidate
        run: >-
          python -m pytest tests/test_file_generation.py tests/test_file_intake.py tests/test_file_worker.py
          tests/test_document_design.py tests/test_workbook_design.py tests/test_deck_design.py
          tests/test_file_editing.py tests/test_file_store.py tests/test_file_assistant.py tests/test_files_router.py
          tests/test_file_intent.py tests/test_files_chat_handoff.py -v -rA -p no:cacheprovider
          --junitxml="$RUNNER_TEMP/file-generation.xml"

      # The test modules skip themselves when a document library is missing,
      # so a green run must prove nothing was skipped and the expected number
      # ran: 166 generation, 65 intake, 36 worker, 109 document-design, 240 workbook, 63 deck and 60 editing
      # tests, and 12 store, 9 assistant, 12 router, 28 intent and 2 chat-handoff tests. The
      # worker's memory-limit test runs only on POSIX, so it must run here.
      - name: Require every file test to have run
        run: |
          python - "$RUNNER_TEMP/file-generation.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          print(totals)
          if totals != {"tests": 802, "skipped": 0, "failures": 0, "errors": 0}:
              sys.exit("the file verification did not run completely")
          PY
