# Focused offline verification of the anonymous daily allowance.
#
# Runs only when started by hand, against one explicit, immutable commit the
# operator supplies as verification_sha (a full 40-character SHA). That
# commit must descend from the anonymous allowance's app-wiring base, so
# this workflow cannot be pointed at an unrelated commit.
#
# Network: installing the repository's pinned dependencies may contact the
# Python package index. The test run itself is protected by the repository's
# candidate/tests/conftest.py, which refuses every non-loopback connection.
# No repository secret, provider key, production or staging setting is used;
# no provider, application server, PostgreSQL or outside database is
# contacted. Tests use SQLite files in the runner's temporary directory.
name: anonymous-allowance-offline

on:
  workflow_dispatch:
    inputs:
      verification_sha:
        description: "Full lowercase 40-character commit SHA to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: anonymous-allowance-offline-${{ inputs.verification_sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # The input reaches the shell only as an environment variable, never as
      # interpolated shell source.
      - name: Validate the verification commit SHA
        shell: bash
        env:
          VERIFICATION_SHA: ${{ inputs.verification_sha }}
        run: |
          if [[ ! "$VERIFICATION_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "verification_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi

      - name: Check out exactly that commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verification_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the checked-out commit
        shell: bash
        env:
          VERIFICATION_SHA: ${{ inputs.verification_sha }}
          WIRING_BASE_SHA: 9fc75a17452850be51b326bb6668fb10ea77b199
        run: |
          head="$(git rev-parse HEAD)"
          if [[ "$head" != "$VERIFICATION_SHA" ]]; then
            echo "checked-out commit does not equal verification_sha" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$WIRING_BASE_SHA" "$head"; then
            echo "verification_sha does not descend from the anonymous allowance wiring base" >&2
            exit 1
          fi
          echo "verifying $head"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # May contact the Python package index; nothing below does.
      - name: Install the repository's pinned dependencies
        run: >-
          python -m pip install
          -r requirements-production-lock.txt
          -r requirements-database.txt
          -r requirements-dev.txt

      # conftest.py blocks every non-loopback connection for the whole run.
      - name: Run the focused anonymous allowance tests
        working-directory: candidate
        run: >-
          python -m pytest
          tests/test_anonymous_chat.py
          tests/test_usage_limits.py
          tests/test_usage_enforcement.py
          -v -rA -p no:cacheprovider
          --junitxml="$RUNNER_TEMP/anonymous-allowance-offline.xml"

      # A green run must mean every focused test executed: none skipped,
      # failed or errored, and exactly the expected number collected
      # (test_anonymous_chat.py 55, test_usage_limits.py 135,
      # test_usage_enforcement.py 57).
      - name: Require every focused test to have run
        run: |
          python - "$RUNNER_TEMP/anonymous-allowance-offline.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          print(totals)
          if totals != {"tests": 247, "skipped": 0, "failures": 0, "errors": 0}:
              sys.exit("the focused anonymous allowance verification did not run completely")
          PY
