# Verification of Spaces (saved conversations) on SQLite: the API, the persistent send through the real
# /api/chat lifecycle (request budget, admission, provider controls, the account quota), finalization,
# history and search isolation, prompt authority, truthfulness, and reasoning modes and the paid scope on
# Space sends (R1, B2). The model transport and search are replaced at their lowest layer; no provider,
# credential, PostgreSQL or deployment is used, and candidate/tests/conftest.py refuses every non-loopback
# connection. Spaces on real PostgreSQL under V1 is in subscription-foundation-verification.
name: spaces-verification

on:
  pull_request:
    paths:
      - "candidate/kalillac_spaces/**"
      - "candidate/kalillac_routing/reasoning_modes.py"
      - "candidate/kalillac_accounts/quota.py"
      - "candidate/kalillac_accounts/paid_access.py"
      - "candidate/app_fastapi_candidate.py"
      - "candidate/tests/test_spaces_*.py"
      - "candidate/tests/spaces_test_support.py"
      - "candidate/tests/test_reasoning_modes.py"
      - ".github/workflows/spaces-verification.yml"
  # Also on pushes to feature branches: a workflow that is not yet on the default branch cannot be
  # dispatched by hand.
  push:
    branches: ["feat/**"]
    paths:
      - "candidate/kalillac_spaces/**"
      - "candidate/kalillac_routing/reasoning_modes.py"
      - "candidate/kalillac_accounts/quota.py"
      - "candidate/kalillac_accounts/paid_access.py"
      - "candidate/app_fastapi_candidate.py"
      - "candidate/tests/test_spaces_*.py"
      - "candidate/tests/spaces_test_support.py"
      - "candidate/tests/test_reasoning_modes.py"
      - ".github/workflows/spaces-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spaces-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the repository's pinned dependencies
        run: >-
          python -m pip install
          -r requirements-production-lock.txt
          -r requirements-dev.txt
          -r requirements-database.txt

      - name: Run the Spaces and reasoning-mode suites
        working-directory: candidate
        run: >-
          python -m pytest
          tests/test_spaces_anonymous_unchanged.py tests/test_spaces_api.py tests/test_spaces_chat.py
          tests/test_spaces_config.py tests/test_spaces_finalize.py tests/test_spaces_history_and_search.py
          tests/test_spaces_history_records.py tests/test_spaces_live_routing.py tests/test_spaces_migration.py
          tests/test_spaces_precommit.py tests/test_spaces_prompt_authority.py tests/test_spaces_quota.py
          tests/test_spaces_request_isolation.py tests/test_spaces_search_grammar.py
          tests/test_spaces_search_routing.py tests/test_spaces_send_bounds.py tests/test_spaces_truthfulness.py
          tests/test_spaces_reasoning.py tests/test_reasoning_modes.py
          -q -rfE -p no:cacheprovider
          --junitxml="$RUNNER_TEMP/spaces.xml"

      # A green run must mean every test executed: exactly the expected number collected (1249,
      # from `pytest --collect-only` over the files above), none skipped, failed or errored.
      - name: Require every Spaces test to have run
        run: |
          python - "$RUNNER_TEMP/spaces.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          print(totals)
          if totals != {"tests": 1249, "skipped": 0, "failures": 0, "errors": 0}:
              sys.exit("the Spaces verification did not run completely")
          PY
