# Verification for the code-structure, Android-scroll and syntax-highlighting
# fixes: the router and response-structure tests, the continuation, resend and
# revision tests, the chat frontend's browser tests (including syntax
# highlighting) and the built homepage's browser tests (including the Chromium
# mobile touch-emulation scroll test), and the default-off account pages
# against a fake same-origin account API.
#
# Chromium touch emulation is not real Android Chrome; real-device Android
# verification remains a separate manual acceptance test.
#
# Network: installing the repository's pinned dependencies may contact the
# Python package index (pip) and the npm registry (npm ci). The test run itself
# is protected by candidate/tests/conftest.py, which refuses every non-loopback
# connection; the browser tests also send every non-loopback connection to a
# dead proxy. No repository secret, provider key, production or staging
# setting is used; no provider, application server, PostgreSQL, database
# migration, service operation or deployment is involved. The runner image's
# preinstalled Chromium-family browser is used; none is installed here.
name: code-structure-frontend-verification

on:
  pull_request:
    paths:
      - "candidate/**"
      - "frontend/**"
      - "site/**"
      - "requirements-*.txt"
      - ".github/workflows/code-structure-frontend-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-structure-frontend-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # Full history: two frontend tests compare against fixed base commits.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # May contact the Python package index.
      - name: Install the repository's pinned dependencies
        run: >-
          python -m pip install
          -r requirements-production-lock.txt
          -r requirements-database.txt
          -r requirements-dev.txt

      # No dependency cache is restored or saved.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"

      # May contact the npm registry; installs exactly site/package-lock.json.
      - name: Install the site's locked dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Type-check the site
        working-directory: site
        run: npm run typecheck

      # The homepage tests serve this build (site/dist/public) from loopback.
      - name: Build the site
        working-directory: site
        run: npm run build

      # The browser tests use the runner image's own browser; none is installed.
      - name: Require a supported browser on the runner
        shell: bash
        run: |
          for name in microsoft-edge microsoft-edge-stable chromium chromium-browser google-chrome google-chrome-stable; do
            if command -v "$name" >/dev/null 2>&1; then
              echo "browser: $name ($(command -v "$name"))"
              exit 0
            fi
          done
          echo "no supported Chromium-family browser is installed on this runner" >&2
          exit 1

      # conftest.py blocks every non-loopback connection for the whole run.
      - name: Run the focused router, frontend and browser tests
        working-directory: candidate
        run: >-
          python -m pytest
          tests/test_code_explanation_structure.py
          tests/test_code_intent_and_explanatory_precedence.py
          tests/test_lean_router_phase1.py
          tests/test_router_generation_regressions.py
          tests/test_router_semantic_behavior.py
          tests/test_route_navigation.py
          tests/test_continuation_stitching.py
          tests/test_explanation_continuation.py
          tests/test_self_knowledge_voice.py
          tests/test_math_continuation_rendering.py
          tests/test_frontend_error_contract.py
          tests/test_frontend_end_erase.py
          tests/test_session_end.py
          tests/test_homepage_handoff.py
          tests/test_homepage_interaction.py
          tests/test_public_identity.py
          tests/test_account_ui.py
          tests/test_homepage_first_load.py
          tests/test_frontend_trust_presentation.py
          -v -rA -p no:cacheprovider
          --junitxml="$RUNNER_TEMP/code-structure-frontend-verification.xml"

      # A green run must mean every focused test executed: exactly the
      # expected number collected (1851, from `pytest --collect-only` over the
      # files above: the homepage composer is now native, so the 395 tests of
      # the framed homepage chat were replaced by 527 native-composer, handoff
      # (ledger, deadline, stall recovery, early Back and ownership) and /app/
      # workspace tests; the 215 chat trust-presentation tests have no skips),
      # exactly 1832 passed and exactly 19 skipped --
      # each skip one of the homepage tests' own per-viewport skips -- and none
      # failed or errored.
      # The suite totals and every test case's own outcome must both agree.
      # A missing browser, site build or git history fails the run instead of
      # skipping.
      - name: Require every focused test to have run
        run: |
          python - "$RUNNER_TEMP/code-structure-frontend-verification.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          totals["passed"] = totals["tests"] - totals["skipped"] - totals["failures"] - totals["errors"]
          print(totals)
          allowed = (
              "phones reach the workspace through the CTA",
              "the side-by-side first screen applies at 1440 x 900 and wider",
              "reduced-motion viewport only",
          )
          counted = {"tests": 0, "passed": 0, "skipped": 0, "failures": 0, "errors": 0}
          unexpected = []
          for case in root.iter("testcase"):
              counted["tests"] += 1
              if case.find("failure") is not None:
                  counted["failures"] += 1
              elif case.find("error") is not None:
                  counted["errors"] += 1
              elif case.find("skipped") is not None:
                  counted["skipped"] += 1
              else:
                  counted["passed"] += 1
              for skip in case.findall("skipped"):
                  reason = (skip.get("message") or "") + " " + (skip.text or "")
                  if not any(text in reason for text in allowed):
                      unexpected.append(f"{case.get('classname')}::{case.get('name')}: {reason.strip()}")
          for line in unexpected:
              print("unexpected skip:", line)
          expected = {"tests": 1851, "passed": 1832, "skipped": 19, "failures": 0, "errors": 0}
          if totals != expected or counted != expected or unexpected:
              sys.exit("the focused verification did not run completely")
          PY


      # Backend authority is exercised against both default and flag-on builds.
      - name: Verify backend authority with the default frontend build
        working-directory: candidate
        env:
          KALILLAC_REGISTRATION_UI_DIST: ../site/dist/public
        run: >-
          python -m pytest tests/test_registration_ui.py
          -k backend_contract_overrides_frontend_build_mode
          -q -p no:cacheprovider
          --junitxml="$RUNNER_TEMP/registration-default-contract.xml"

      - name: Require both default-build contract mismatch cases
        run: |
          python - "$RUNNER_TEMP/registration-default-contract.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          assert totals == {"tests": 2, "skipped": 0, "failures": 0, "errors": 0}
          PY

      - name: Build the separate V2 registration browser fixture
        working-directory: site
        env:
          VITE_ACCOUNT_REGISTRATION_V2_ENABLED: "true"
        run: npm run build -- --outDir "$RUNNER_TEMP/registration-v2-site"

      - name: Run the V2 registration browser contracts
        working-directory: candidate
        env:
          KALILLAC_REGISTRATION_UI_DIST: ${{ runner.temp }}/registration-v2-site
        run: >-
          python -m pytest tests/test_registration_ui.py
          -q -p no:cacheprovider
          --junitxml="$RUNNER_TEMP/registration-browser.xml"

      - name: Require every V2 registration browser test
        run: |
          python - "$RUNNER_TEMP/registration-browser.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "skipped", "failures", "errors")}
          print(totals)
          assert totals == {"tests": 46, "skipped": 0, "failures": 0, "errors": 0}
          PY
