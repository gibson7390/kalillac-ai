# Alembic configuration for Kalillac's optional PostgreSQL layer.
#
# The database URL is NOT stored here. migrations/env.py reads it from the
# same environment as the application (KALILLAC_DB_ENABLED plus either
# KALILLAC_DATABASE_URL or the KALILLAC_DB_* component settings with the
# systemd credential password).
#
# Usage (from this directory):
#   alembic upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
